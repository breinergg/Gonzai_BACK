# Despliegue completo de GonzAI: PostgreSQL + API (.NET 8) + Web (Angular servido por nginx).
#
#   cp .env.example .env     # y completa los valores
#   docker compose up -d --build
#
# Asume la estructura de carpetas:  gonzai/backend/Gonzai_BACK (este repo)  y  gonzai/frontend/Gonzai_FRONT-v2.
# El servicio "web" escucha en HTTP (puerto WEB_PORT). Pon delante un terminador TLS
# (Caddy, Cloudflare, balanceador del hosting...) y deja HTTPS solo hacia afuera.
name: gonzai

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gonzai
      POSTGRES_USER: gonzai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - gonzai-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gonzai -d gonzai"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Sin "ports": la base solo es accesible desde la red interna de compose.

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=gonzai;Username=gonzai;Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:?Define JWT_KEY en .env (mínimo 32 caracteres)}
      Gemini__ApiKey: ${GEMINI_API_KEY:?Define GEMINI_API_KEY en .env}
      # Se aplican las migraciones y se crea el primer Admin si la tabla de usuarios está vacía.
      Database__MigrateOnStartup: "true"
      Seed__AdminName: ${ADMIN_NAME:-Administrador}
      Seed__AdminEmail: ${ADMIN_EMAIL:?Define ADMIN_EMAIL en .env}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en .env}
      # nginx (servicio web) es el único proxy delante de la API.
      ForwardedHeaders__Enabled: "true"
      ForwardedHeaders__ForwardLimit: ${FORWARD_LIMIT:-1}
      HttpsRedirection__Enabled: "false"
      Cors__Origins__0: ${PUBLIC_URL:?Define PUBLIC_URL en .env (ej. https://gonzai.midominio.com)}
      Comprobantes__BaseUrl: ${PUBLIC_URL}
      AllowedHosts: ${PUBLIC_HOST:?Define PUBLIC_HOST en .env (ej. gonzai.midominio.com)}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Security: ${SMTP_SECURITY:-starttls}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__From: ${SMTP_FROM:-}
    # Sin "ports": solo se llega por nginx.

  web:
    build:
      context: ../../../frontend/Gonzai_FRONT-v2
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  gonzai-pgdata:
